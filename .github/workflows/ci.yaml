name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_models:
        type: boolean
        default: false
        description: Download public models and run Russian synthetic-speech smoke test
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: psitech_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: psitech_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U psitech_test -d psitech_test" --health-interval=3s --health-retries=30
    env:
      TEST_DATABASE_URL: postgres://psitech_test:disposable-ci-only@localhost:5432/psitech_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-app/go.mod
          cache-dependency-path: backend-app/go.sum
      - run: go vet ./... && go test -race -cover ./...
        working-directory: backend-app
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend-app
      - run: go test -race ./...
        working-directory: infra/backup
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci --include=dev && npm run generate && npm run typecheck && npm run lint && npm run format:check && npm run build
        working-directory: frontend-app
      - run: git diff --exit-code -- frontend-app/packages/api-client/schema.d.ts
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: ./scripts/dev-setup.sh && docker compose build audio
      - run: docker compose run --rm --no-deps audio python -m pytest -q
      - run: docker compose run --rm --no-deps audio sh -c 'python -m mypy --strict *.py && python -m black --check . && python -m ruff check .'
  voicefm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: ./scripts/dev-setup.sh && docker compose build voicefm
      - run: docker compose run --rm --no-deps voicefm python -m pytest -q
      - run: docker compose run --rm --no-deps voicefm sh -c 'python -m mypy --strict *.py && python -m black --check . && python -m ruff check .'
  stand:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make up WITH_MODELS=0
      - run: npm ci --include=dev && npx playwright install --with-deps chromium firefox && npm run test:e2e
        working-directory: frontend-app
      - name: Firefox browser regressions on loopback IP
        run: E2E_BROWSER=firefox E2E_BASE_URL=http://127.0.0.1:8080 npm run test:e2e
        working-directory: frontend-app
      - name: Verify encrypted backup restoration in an isolated database
        run: ./scripts/backup.sh .local/ci-snapshot.psibak && ./scripts/restore-check.sh .local/ci-snapshot.psibak
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: psitech-api:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: psitech-frontend:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan audio image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: psitech-audio:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan clinical adapter image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: psitech-voicefm:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan database image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: psitech-postgres:16.15-patched
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Build HTTPS proxy image
        run: docker compose -f compose.yaml -f compose.pilot.yaml build gateway
      - name: Scan HTTPS proxy image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: psitech-caddy:2.11.7-patched
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - if: always()
        run: docker compose down
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend-app/test-results
  model-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.real_models
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/dev-setup.sh && docker compose run --build --rm models
      - run: docker compose run --rm -e RUN_MODEL_SMOKE=1 --no-deps audio python -m pytest -q tests/test_model_smoke.py

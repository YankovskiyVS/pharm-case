server {
 listen 8080;
 server_name _;
 absolute_redirect off;
 resolver 127.0.0.11 valid=10s ipv6=off;
 resolver_timeout 3s;
 set $api_upstream api:8000;
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 192.168.0.0/16;
 real_ip_header X-Real-IP;
 real_ip_recursive off;
 client_max_body_size 12m;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /health { access_log off; return 200 'ok'; }
 location = / { return 302 /patient/; }
 location = /doctor { return 302 /doctor/; }
 location = /patient { return 302 /patient/; }
 location /doctor/ { try_files $uri $uri/ /doctor/index.html; expires -1; }
 location /patient/ { try_files $uri $uri/ /patient/index.html; expires -1; }
 location /api/ {
  proxy_pass http://$api_upstream$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_buffering off;
  proxy_read_timeout 300s;
  access_log off;
 }
 location / { return 404; }
}

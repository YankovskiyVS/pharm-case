name: psitech-pilot
services:
  api:
    environment:
      SEED_DEMO: "false"
      COOKIE_SECURE: "true"
      APP_ORIGINS: "https://localhost:${HTTPS_PORT:-8443},https://127.0.0.1:${HTTPS_PORT:-8443}"
      PUBLIC_URL: "https://localhost:${HTTPS_PORT:-8443}"
  frontend:
    ports: !reset []
  gateway:
    image: psitech-caddy:2.11.7-patched
    build: ./infra/caddy
    ports: ["127.0.0.1:${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q --no-check-certificate -O /dev/null https://localhost/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 128m
  gmail-authorize:
    volumes: !override ["${PILOT_SECRETS_DIR:-./.local/pilot}/gmail:/config"]
  voicefm:
    volumes: !override ["${PILOT_VOICEFM_ARTIFACT_DIR:-${PILOT_SECRETS_DIR:-./.local/pilot}/voicefm}:/models:ro"]
volumes:
  caddy_data:
  caddy_config:
secrets:
  support_chat_api_key:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/support_chat_api_key
  db_password:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/db_password
  seed_password:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/seed_password
  doctor_totp:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/doctor_totp
  audio_token:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/audio_token
  voicefm_token:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/voicefm_token
  email_encryption_key:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/email_encryption_key
  gmail_credentials:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/gmail/credentials.json
  ops_token:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/ops_token
  backup_key:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/backup_key
  app_db_password:
    file: ${PILOT_SECRETS_DIR:-./.local/pilot}/app_db_password
